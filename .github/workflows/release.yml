name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact candidate commit
        id: candidate
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  release-review:
    needs: resolve-candidate
    uses: ./.github/workflows/release-review.yml
    permissions:
      contents: read
    with:
      candidate_sha: ${{ needs.resolve-candidate.outputs.sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  publish:
    needs: [resolve-candidate, release-review]
    name: Publish crate and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the reviewed candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
          persist-credentials: false

      - name: Install the reviewed package's MSRV
        shell: bash
        run: |
          set -euo pipefail
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Verify the tag matches the package version
        shell: bash
        run: |
          metadata="$(cargo +"$MSRV" metadata --no-deps --format-version=1)"
          crate_name="$(jq -r '.packages[0].name' <<<"$metadata")"
          package_version="$(jq -r '.packages[0].version' <<<"$metadata")"

          test -n "$crate_name"
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

          {
            echo "CRATE_NAME=$crate_name"
            echo "PACKAGE_VERSION=$package_version"
          } >> "$GITHUB_ENV"

      - name: Confirm the remote tag still identifies the reviewed commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_sha="$(git ls-remote --exit-code --tags origin "$tag_ref" "${tag_ref}^{}" |
            awk -v ref="$tag_ref" '
              $2 == ref { tag = $1 }
              $2 == (ref "^{}") { peeled = $1 }
              END { print (peeled != "" ? peeled : tag) }
            ')"
          test "$tag_sha" = "$CANDIDATE_SHA"

      - name: Authenticate to crates.io with OIDC
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: |
          published="$(
            curl --fail --retry 3 --silent --show-error https://index.crates.io/co/mp/composite-mvt |
              jq --slurp --arg name "$CRATE_NAME" --arg version "$PACKAGE_VERSION" '
                if length == 0 or any(.[]; .name != $name or (.vers | type) != "string") then
                  error("invalid crates.io sparse index")
                else
                  any(.[]; .vers == $version)
                end
              '
          )"

          if [[ "$published" == true ]]; then
            echo "${CRATE_NAME} ${PACKAGE_VERSION} is already published; skipping upload."
          else
            cargo +"$MSRV" publish --locked --registry crates-io
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists; skipping creation."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
