name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish crate and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Install Rust 1.87
        run: rustup toolchain install 1.87.0 --profile minimal

      - name: Verify the tag matches the package version
        shell: bash
        run: |
          metadata="$(cargo +1.87.0 metadata --no-deps --format-version=1)"
          crate_name="$(jq -r '.packages[0].name' <<<"$metadata")"
          package_version="$(jq -r '.packages[0].version' <<<"$metadata")"

          test -n "$crate_name"
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

          {
            echo "CRATE_NAME=$crate_name"
            echo "PACKAGE_VERSION=$package_version"
          } >> "$GITHUB_ENV"

      - name: Test all targets and features
        run: cargo +1.87.0 test --all-targets --all-features --locked

      - name: Verify the publishable package
        run: cargo +1.87.0 publish --dry-run --locked --registry crates-io

      - name: Authenticate to crates.io with OIDC
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: |
          published="$(
            curl --fail --retry 3 --silent --show-error https://index.crates.io/co/mp/composite-mvt |
              jq --slurp --arg name "$CRATE_NAME" --arg version "$PACKAGE_VERSION" '
                if length == 0 or any(.[]; .name != $name or (.vers | type) != "string") then
                  error("invalid crates.io sparse index")
                else
                  any(.[]; .vers == $version)
                end
              '
          )"

          if [[ "$published" == true ]]; then
            echo "${CRATE_NAME} ${PACKAGE_VERSION} is already published; skipping upload."
          else
            cargo +1.87.0 publish --locked --registry crates-io
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists; skipping creation."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
